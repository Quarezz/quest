<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140e0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Квест</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css?v=4" />
  </head>
  <body>
    <main class="app">
      <noscript>
        <p>Увімкни JavaScript, щоб крутити колесо.</p>
      </noscript>
      <section id="screen-home" class="screen is-on">
        <p class="eyebrow">Фотоквест</p>
        <h1>Відскануй QR</h1>
        <p class="lede">
          Ця сторінка відкривається з QR-коду на точці маршруту. Відскануй код
          на телефоні — і крути колесо.
        </p>
      </section>

      <section id="screen-wheel" class="screen" hidden>
        <p id="stop-badge" class="eyebrow">Точка</p>
        <h1 id="wheel-title">Колесо фортуни</h1>
        <div class="wheel-stage">
          <div class="wheel-wrap">
            <div class="pointer" aria-hidden="true"></div>
            <div class="wheel-frame">
              <canvas id="wheel" width="320" height="320"></canvas>
            </div>
          </div>
        </div>
        <button id="spin-btn" class="btn" type="button">Крутити</button>
      </section>

      <section id="screen-prize" class="screen" hidden>
        <p class="eyebrow">Твій подарунок</p>
        <p id="prize-emoji" class="prize-emoji" aria-hidden="true"></p>
        <h1 id="prize-label"></h1>
        <button id="prize-continue" class="btn" type="button">Далі</button>
      </section>

      <section id="screen-clue" class="screen screen-clue" hidden>
        <p id="clue-prompt" class="clue-prompt">Знайди це місце</p>
        <figure class="photo-wrap">
          <img id="clue-image" alt="" />
        </figure>
        <p id="clue-ending" class="ending" hidden></p>
        <p id="clue-hint" class="hint" hidden></p>
        <button
          id="hint-btn"
          class="btn btn-ghost"
          type="button"
          aria-expanded="false"
        >
          Підказка
        </button>
      </section>
    </main>

    <script src="js/quest.js?v=4"></script>
    <script src="js/wheel.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
  </body>
</html>
