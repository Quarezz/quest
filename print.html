<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR-коди квесту</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7ead8;
        --ink: #140e0a;
        --gold: #c9a227;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: Manrope, system-ui, sans-serif;
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        margin: 0 0 8px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 16px 0 28px;
      }
      label {
        font-weight: 700;
      }
      input {
        flex: 1 1 280px;
        min-height: 44px;
        padding: 8px 12px;
        font: inherit;
        font-size: 16px;
        border: 2px solid var(--ink);
        border-radius: 8px;
      }
      button {
        min-height: 44px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 700;
        background: var(--ink);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
      }
      .note {
        margin: 0 0 20px;
        max-width: 60ch;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 24px;
      }
      .card {
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
        break-inside: avoid;
      }
      .qr {
        display: flex;
        justify-content: center;
        margin: 12px 0;
      }
      .qr canvas,
      .qr img {
        width: 220px;
        height: 220px;
      }
      .url {
        font-size: 13px;
        word-break: break-all;
      }
      @media print {
        .controls,
        .note,
        .no-print {
          display: none !important;
        }
        body {
          padding: 0;
          background: #fff;
        }
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <h1>QR-коди квесту</h1>
    <p class="note">
      Після деплою на GitHub Pages перевір базову адресу, натисни «Оновити» і
      роздрукуй сторінку. Кожен код веде на відповідну точку.
    </p>
    <div class="controls no-print">
      <label for="base">Базовий URL</label>
      <input id="base" type="url" />
      <button id="refresh" type="button">Оновити</button>
      <button id="print" type="button">Друкувати</button>
    </div>
    <div id="grid" class="grid"></div>
    <script src="js/qrcode.min.js"></script>
    <script>
      const DEFAULT_BASE = "https://quarezz.github.io/quest/";
      const STOPS = [
        { id: 1, title: "Точка 1" },
        { id: 2, title: "Точка 2" },
        { id: 3, title: "Точка 3" },
        { id: 4, title: "Точка 4" },
        { id: 5, title: "Точка 5" },
        { id: 6, title: "Фінал" },
      ];

      const baseInput = document.querySelector("#base");
      const grid = document.querySelector("#grid");

      function normalizeBase(value) {
        const trimmed = (value || DEFAULT_BASE).trim();
        try {
          const url = new URL(trimmed);
          let path = url.pathname;
          if (!path.endsWith("/")) path += "/";
          return `${url.origin}${path}`;
        } catch {
          return DEFAULT_BASE;
        }
      }

      function stopUrl(base, id) {
        return `${base}?s=${id}`;
      }

      function render() {
        const base = normalizeBase(baseInput.value);
        baseInput.value = base.replace(/\/$/, "") + "/";
        grid.innerHTML = "";
        STOPS.forEach((stop) => {
          const url = stopUrl(base, stop.id);
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `<h2>${stop.title}</h2><div class="qr"></div><p class="url">${url}</p>`;
          grid.appendChild(card);
          new QRCode(card.querySelector(".qr"), {
            text: url,
            width: 220,
            height: 220,
            colorDark: "#140e0a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M,
          });
        });
      }

      baseInput.value = DEFAULT_BASE;
      document.querySelector("#refresh").addEventListener("click", render);
      document.querySelector("#print").addEventListener("click", () => window.print());
      render();
    </script>
  </body>
</html>
